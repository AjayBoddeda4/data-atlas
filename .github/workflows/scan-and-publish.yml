name: Scan career sites and publish Data Atlas
on:
  push:
    branches: [main]
    paths-ignore:
      - 'app/**'
      - 'public/**'
      - '*.md'
      - '.github/workflows/deploy-ui.yml'
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Maximum career sites this run (remaining sites rotate into later runs)'
        default: '400'
  schedule:
    - cron: '7,37 * * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: data-atlas-scan-and-publish
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
      - run: npm ci
      - name: Restore persistent job snapshots
        run: |
          mkdir -p state
          if git ls-remote --exit-code --heads origin atlas-data; then
            git fetch origin atlas-data:refs/remotes/origin/atlas-data
            git show origin/atlas-data:state.json > state/state.json
          fi
      - run: npm run check && npm test
      - name: Check next batch of career sites
        env:
          SCAN_BATCH_SIZE: ${{ inputs.batch_size || (github.event_name == 'push' && '5' || '400') }}
          SCAN_MINUTES: ${{ github.event_name == 'push' && '2' || '20' }}
        run: npm run scan
      - name: Preserve snapshots, cursor, discoveries and evidence
        run: node scripts/persist-state.mjs
      - run: npm run publish:data
      - uses: actions/configure-pages@v5
        id: pages
      - run: npm run build
        env:
          VITE_GITHUB_REPOSITORY: ${{ github.repository }}
          SITE_URL: ${{ vars.SITE_URL || steps.pages.outputs.base_url }}
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: scan
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
